version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: [ "Microsoft.*", "System.*" ]
  - package-ecosystem: nuget
    directory: /EcommerceAPI.Tests
    schedule:
      interval: weekly
    groups:
      testing:
        patterns: [ "*" ]
  - package-ecosystem: npm
    directory: /ecommerce-admin
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
